<!doctype html>
<!--
	The fallback under the fallback (#377).

	`src/routes/+error.svelte` renders inside the root layout, so it cannot help
	when the root layout's own load is what threw — SvelteKit skips the app
	entirely and serves this file. That is rare and always a server-side fault,
	which is why it says less than the Svelte page and offers exactly one way out.

	It carries its own styles because app.css is part of the build it could not
	load. The theme follows the OS rather than the reader's toggle: the toggle
	lives in localStorage and reading it would mean shipping script into a page
	whose whole reason to exist is that the app did not come up.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>%sveltekit.status% — untitledconference</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #fff;
				--fg: #171717;
				--muted: #737373;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: oklch(0.2 0 0);
					--fg: oklch(0.92 0.008 85);
					--muted: oklch(0.72 0.006 85);
				}
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2rem;
				background: var(--bg);
				color: var(--fg);
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
				text-align: center;
			}
			.status {
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 0.875rem;
				letter-spacing: 0.2em;
				color: var(--muted);
			}
			h1 {
				margin: 0.75rem 0 0;
				font-size: 1.875rem;
				font-weight: 600;
				letter-spacing: -0.02em;
			}
			p {
				margin: 1rem 0 0;
				color: var(--muted);
				max-width: 32rem;
			}
			a {
				display: inline-block;
				margin-top: 2rem;
				color: inherit;
				font-weight: 500;
				text-decoration: underline;
				text-underline-offset: 4px;
			}
		</style>
	</head>
	<body>
		<div>
			<p class="status">%sveltekit.status%</p>
			<h1>untitledconference is not answering</h1>
			<p>%sveltekit.error.message%</p>
			<a href="/">Go to the start page</a>
		</div>
	</body>
</html>
