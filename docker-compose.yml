services:
  test-db:
    image: postgres
    container_name: postgres-vibe-starter-test
    restart: always
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d test']
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_test_data:
