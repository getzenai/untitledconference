name: Deploy

# Deploys `main` to Cloudflare Workers after CI has passed.
#
# Credentials come from Infisical at run time via GitHub OIDC — there are no
# long-lived secrets in this repository. The identity is bound to
# `repo:getzenai/untitledconference:ref:refs/heads/main`, so a pull request
# (which can come from a fork) cannot mint a token and read production secrets.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label. Switch to ubuntu-latest when Blacksmith stops picking up jobs.'
        default: blacksmith-4vcpu-ubuntu-2404
        type: choice
        options:
          - blacksmith-4vcpu-ubuntu-2404
          - ubuntu-latest

permissions:
  contents: read
  id-token: write # required for OIDC; without it the Infisical step fails

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy
    # `inputs` is null on the workflow_run path, so that keeps Blacksmith.
    runs-on: ${{ inputs.runner || 'blacksmith-4vcpu-ubuntu-2404' }}
    # A healthy deploy takes ~3 minutes. Without a ceiling, one hung step blocks
    # the deploy-production concurrency queue for the 6-hour GitHub default.
    timeout-minutes: 30
    # Never deploy a red main.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fetches CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NEON_CONNECTION_STRING,
      # BETTER_AUTH_SECRET, RESEND_API_KEY, the two AI_GATEWAY_* variables and the
      # R2 keys as environment variables
      # for the rest of this job only.
      #
      # `domain` is not optional for us: it defaults to app.infisical.com and our
      # tenant is in the EU region. Omitting it fails authentication without saying why.
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: e8e7dc26-6908-4548-bf57-32edd043e944
          project-slug: untitled-conference
          env-slug: prod
          domain: https://eu.infisical.com

      # Refuse to deploy against a database we cannot reach, rather than shipping
      # a Worker that 500s on every request.
      - name: Verify required variables are present
        run: |
          missing=0
          # The two AI_GATEWAY_* variables are here because the reviewer chat is
          # switched on in wrangler.jsonc: without them the panel renders and every
          # message answers "AI Gateway is not configured"
          # (src/lib/server/chat/model.ts). The base URL is not a secret, but it
          # carries the account id, and keeping both in Infisical keeps them
          # together.
          for var in NEON_CONNECTION_STRING CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BETTER_AUTH_SECRET RESEND_API_KEY AI_GATEWAY_API_KEY AI_GATEWAY_BASE_URL; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is missing from Infisical (project untitled-conference, env prod)"
              missing=1
            fi
          done
          exit $missing

      # A model that answers is not the same as a model this chat can use.
      #
      # The check above proves both AI_GATEWAY_* variables are *set*. It cannot
      # prove they are the *right* ones: `AI_CHAT_MODEL` in wrangler.jsonc names
      # the provider, and the provider decides which key is correct. Change the
      # model string alone and the presence check still passes — the deploy goes
      # green, the panel renders for every reviewer, and each message comes back
      # an upstream auth error. That is worse than the "AI Gateway is not
      # configured" state the flag guard was written to prevent, because nothing
      # fails loudly.
      #
      # So this asks the gateway for one tool call, with the same three values
      # the Worker will get. `2xx` alone is too weak a claim: the reviewer
      # assistant is a tool-calling feature, and a model that talks but cannot
      # call tools would sail through a status-code check and leave every tool
      # silently dead.
      #
      # It runs *before* the dump and the migration on purpose. Drizzle
      # migrations are forward-only, so failing here costs nothing, while
      # failing after them leaves the database moved on from the code.
      #
      # Roughly $0.00008 per deploy on the current model.
      - name: Prove the chat model and the gateway key fit each other
        run: |
          # Actions' default is `bash -e`, which leaves an unset variable as the
          # empty string. Here that would turn a missing base URL into a request
          # against a nonsense path and a confusing 404 instead of a named fault.
          set -euo pipefail

          cat > "$RUNNER_TEMP/read-wrangler-var.mjs" <<'NODE'
          import { readFileSync } from 'node:fs';

          // Strip JSONC comments without touching string contents. A regex cannot do this
          // safely: `"https://untitledconference.com"` contains `//`, so a naive strip
          // turns config values into a syntax error.
          function stripComments(source) {
          	let out = '';
          	let inString = false;
          	let inLine = false;
          	let inBlock = false;
          	for (let i = 0; i < source.length; i++) {
          		const c = source[i];
          		const next = source[i + 1];
          		if (inLine) {
          			if (c === '\n') { inLine = false; out += c; }
          			continue;
          		}
          		if (inBlock) {
          			if (c === '*' && next === '/') { inBlock = false; i++; }
          			continue;
          		}
          		if (inString) {
          			out += c;
          			if (c === '\\') { out += next ?? ''; i++; continue; }
          			if (c === '"') inString = false;
          			continue;
          		}
          		if (c === '"') { inString = true; out += c; continue; }
          		if (c === '/' && next === '/') { inLine = true; i++; continue; }
          		if (c === '/' && next === '*') { inBlock = true; i++; continue; }
          		out += c;
          	}
          	return out;
          }

          const config = JSON.parse(stripComments(readFileSync('wrangler.jsonc', 'utf8')));
          process.stdout.write(String(config.vars?.[process.argv[2]] ?? ''));
          NODE

          chat_enabled="$(node "$RUNNER_TEMP/read-wrangler-var.mjs" FEATURE_INAPP_CHAT)"
          model="$(node "$RUNNER_TEMP/read-wrangler-var.mjs" AI_CHAT_MODEL)"

          # The gate exists to protect the chat. With the panel switched off there is no
          # chat to protect, and a gateway outage must not hold up an unrelated deploy.
          if [ "$chat_enabled" != "true" ]; then
            echo "FEATURE_INAPP_CHAT is '${chat_enabled:-unset}' — no chat panel ships, nothing to prove."
            exit 0
          fi

          if [ -z "$model" ]; then
            echo "::error::FEATURE_INAPP_CHAT is true but AI_CHAT_MODEL is empty in wrangler.jsonc."
            exit 1
          fi

          echo "Model under test: $model"

          # Built with JSON.stringify rather than a heredoc so the model id cannot break
          # out of the payload. `tool_choice: required` on purpose: with `auto` the answer
          # depends on how persuasive the prompt is, and a deploy gate that sometimes
          # passes is worse than no gate.
          MODEL="$model" node -e '
          process.stdout.write(JSON.stringify({
            model: process.env.MODEL,
            max_tokens: 64,
            tool_choice: "required",
            tools: [{
              type: "function",
              function: {
                name: "deploy_smoke_test",
                description: "Acknowledge the deploy smoke test.",
                parameters: {
                  type: "object",
                  properties: { ok: { type: "boolean", description: "Always true." } },
                  required: ["ok"]
                }
              }
            }],
            messages: [
              { role: "system", content: "You verify tool calling. Call the tool you are given." },
              { role: "user", content: "Call deploy_smoke_test with ok set to true." }
            ]
          }));' > "$RUNNER_TEMP/smoke-payload.json"

          # Trailing slash would make this `//chat/completions`, which some gateways 404.
          base="${AI_GATEWAY_BASE_URL%/}"

          # Retries are only for faults that a retry can fix. A 401/403/404 is a wrong key,
          # a wrong URL or a model the provider does not serve — retrying that just spends
          # three times as long arriving at the same answer.
          attempt=1
          while :; do
            # Emptied first: a failed connection never writes the file, and printing the
            # previous attempt's body as if it were this one's is a wrong lead in exactly
            # the moment somebody is reading these logs to find out what broke.
            : > "$RUNNER_TEMP/smoke-response.json"
            code="$(curl -sS -o "$RUNNER_TEMP/smoke-response.json" -w '%{http_code}' --max-time 45 \
              -X POST "$base/chat/completions" \
              -H "Authorization: Bearer $AI_GATEWAY_API_KEY" \
              -H 'Content-Type: application/json' \
              --data @"$RUNNER_TEMP/smoke-payload.json")" || code="000"

            case "$code" in
              2*) break ;;
              000 | 408 | 429 | 5*)
                if [ "$attempt" -ge 3 ]; then
                  echo "::error::The AI Gateway did not answer after 3 attempts (last: HTTP $code). Deploy stopped before migrating."
                  cat "$RUNNER_TEMP/smoke-response.json" 2>/dev/null || true
                  exit 1
                fi
                echo "attempt $attempt: HTTP $code — transient, retrying"
                attempt=$((attempt + 1))
                sleep 5
                ;;
              *)
                echo "::error::The AI Gateway rejected the request with HTTP $code. AI_GATEWAY_API_KEY does not fit AI_CHAT_MODEL ($model), or AI_GATEWAY_BASE_URL is wrong."
                cat "$RUNNER_TEMP/smoke-response.json" 2>/dev/null || true
                exit 1
                ;;
            esac
          done

          # The actual assertion. A 2xx only says something answered; the reviewer chat is
          # useless unless the model calls tools, and not every model that talks can.
          RESPONSE="$RUNNER_TEMP/smoke-response.json" MODEL="$model" node -e '
          const { readFileSync } = require("node:fs");
          let body;
          try {
            body = JSON.parse(readFileSync(process.env.RESPONSE, "utf8"));
          } catch {
            console.log("::error::The gateway returned 2xx with a body that is not JSON.");
            console.log(readFileSync(process.env.RESPONSE, "utf8").slice(0, 500));
            process.exit(1);
          }
          const choice = body.choices?.[0];
          const calls = choice?.message?.tool_calls ?? [];
          const finish = choice?.finish_reason;
          console.log(`finish_reason: ${finish}`);
          console.log(`tool_calls: ${calls.map((c) => c.function?.name).join(", ") || "(none)"}`);
          if (calls.length === 0) {
            console.log(`::error::${process.env.MODEL} answered but called no tool, so the reviewer chat cannot work. Its tools would never fire.`);
            console.log(JSON.stringify(body).slice(0, 500));
            process.exit(1);
          }
          // Asserting on the tool call rather than on the enum: providers disagree about
          // what finish_reason says when a tool fires, and the call itself is the claim.
          if (finish !== "tool_calls") {
            console.log(`::warning::Tool call present but finish_reason is "${finish}", not "tool_calls".`);
          }
          console.log("The configured model reaches the gateway and calls tools.");
          '

      # The probe above proves the gateway can carry a tool call. It does not prove
      # the *chat* can, because it asks in a shape the chat never uses: one tool,
      # `tool_choice: required`, no streaming. The reviewer chat streams, offers
      # several tools and leaves the choice to the model — and that is the request
      # that came back as JSON-in-a-sentence in production (#660).
      #
      # The request body lives in scripts/ai/probe-chat-tools.mjs so that the
      # candidate sweep (probe-chat-models.yaml) measures the same thing this
      # does. A second copy of the shape would be a second definition of what the
      # chat sends, and the shape is the whole point of the measurement.
      #
      # Report-only on purpose, for now: no `--strict`. The failing gate belongs
      # in the same change that fixes the model — a hard gate added before the fix
      # would only stop every unrelated deploy from shipping.
      - name: Probe the gateway in the shape the chat uses
        continue-on-error: true
        run: |
          set -euo pipefail

          chat_enabled="$(node "$RUNNER_TEMP/read-wrangler-var.mjs" FEATURE_INAPP_CHAT)"
          model="$(node "$RUNNER_TEMP/read-wrangler-var.mjs" AI_CHAT_MODEL)"
          if [ "$chat_enabled" != "true" ] || [ -z "$model" ]; then
            echo "No chat ships — nothing to probe."
            exit 0
          fi

          node scripts/ai/probe-chat-tools.mjs "$model"

      # The way back. Drizzle migrations are forward-only, so the rollback path is
      # this dump plus `psql < dump.sql`, not a down-migration. Kept as an artifact
      # because the runner is discarded.
      #
      # Neon runs Postgres 18; Ubuntu 24.04 ships client 16, and pg_dump refuses to
      # dump a server newer than itself. pg_dump runs from the postgres:18 Docker
      # image (already warm in the runner cache for the CI test services) — the
      # PGDG apt route stalled deploys for 20+ minutes when a runner apt mirror
      # went dark (2026-08-12), and apt-get has no timeout of its own.
      - name: Dump the database before migrating
        timeout-minutes: 10
        run: |
          docker run --rm -e NEON_CONNECTION_STRING -v "$PWD:/dump" postgres:18 \
            sh -c 'pg_dump --no-owner --no-privileges --file=/dump/pre-migration.sql "$NEON_CONNECTION_STRING"'
          test -s pre-migration.sql

      - name: Upload pre-migration dump
        uses: actions/upload-artifact@v4
        with:
          name: pre-migration-dump-${{ github.sha }}
          path: pre-migration.sql
          retention-days: 14

      - name: Apply migrations
        run: DATABASE_URL="$NEON_CONNECTION_STRING" node scripts/db/migrate.mjs

      - name: Build
        run: npm run build

      - name: Put application secrets on the Worker
        run: |
          printf '%s' "$BETTER_AUTH_SECRET" | npx wrangler secret put BETTER_AUTH_SECRET
          printf '%s' "$NEON_CONNECTION_STRING" | npx wrangler secret put DATABASE_URL
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          printf '%s' "$AI_GATEWAY_API_KEY" | npx wrangler secret put AI_GATEWAY_API_KEY
          printf '%s' "$AI_GATEWAY_BASE_URL" | npx wrangler secret put AI_GATEWAY_BASE_URL

      - name: Deploy
        run: npx wrangler deploy

      # Proves the deployed Worker can actually reach the database, which is what
      # a missing or wrong variable would break. A green deploy step alone does not.
      - name: Health check
        run: |
          url="https://untitledconference.com/api/v1/public/health"
          echo "Checking $url"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 20 "$url" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 6
          done
          echo "::error::Health check never returned 200 — the Worker is up but not healthy."
          cat /tmp/health.json || true
          exit 1
