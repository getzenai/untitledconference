name: CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      # Documentation. Not '*.md': `format:check` runs prettier over the whole
      # tree, so an unformatted README is a red main — and a PR that only edits
      # one runs no check at all, so nobody can see it coming. #310 merged on
      # 2026-08-13 with zero CI runs; the next PR carrying code inherited the
      # failure and looked like the culprit. The fix (#347) merged unchecked too.
      # A doc PR paying four minutes of CI is the cheaper end of that trade.
      - 'LICENSE'
      # Development environment
      - '.vscode/**'
      - '.idea/**'
      - '.claude/**'
      # Git files
      - '.gitignore'
      - '.gitattributes'
      # Translation cache
      - 'project.inlang/cache/**'
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      # Documentation. Not '*.md': `format:check` runs prettier over the whole
      # tree, so an unformatted README is a red main — and a PR that only edits
      # one runs no check at all, so nobody can see it coming. #310 merged on
      # 2026-08-13 with zero CI runs; the next PR carrying code inherited the
      # failure and looked like the culprit. The fix (#347) merged unchecked too.
      # A doc PR paying four minutes of CI is the cheaper end of that trade.
      - 'LICENSE'
      # Development environment
      - '.vscode/**'
      - '.idea/**'
      - '.claude/**'
      # Git files
      - '.gitignore'
      - '.gitattributes'
      # Translation cache
      - 'project.inlang/cache/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Code quality checks - format, lint, and type checking
  code-quality:
    name: Code Quality Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate i18n translations
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Check code formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run type checking
        run: npm run check

  # Build the application
  build:
    name: Build Application
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [code-quality]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate i18n translations
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Build SvelteKit application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .svelte-kit
            build
          include-hidden-files: true
          retention-days: 1

  # Unit tests - no database required
  unit-tests:
    name: Unit Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [code-quality]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate i18n translations
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Run unit tests
        run: npm run test:unit

  # Integration tests - requires database
  # Migration checks against a real database. Cheap, and the most valuable job in
  # this file now that the deploy migrates automatically:
  #  1. Every committed migration applies cleanly to a fresh Postgres — the same
  #     code path the deploy job runs, so a broken migration fails here and not
  #     against the live database.
  #  2. Drift: `drizzle-kit generate` must produce nothing. Catches a schema change
  #     committed without its migration, which would otherwise deploy an app
  #     against a database that lacks its columns.
  migration-check:
    name: Migration Check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [code-quality]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: migrate_check
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply every migration to a fresh database
        run: node scripts/db/migrate.mjs --allow-any-tree
        env:
          DATABASE_URL: postgres://root:mysecretpassword@localhost:5434/migrate_check

      - name: Check for schema drift (a migration that was never generated)
        env:
          DATABASE_URL: postgres://root:mysecretpassword@localhost:5434/migrate_check
        run: |
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::Schema changed without a matching migration. Run 'npm run db:generate -- --name <name>' and commit the result."
            git status --porcelain drizzle/
            exit 1
          fi

  # Runs on pull requests. It was gated off them to keep PRs under three minutes,
  # and that gate cost us: two merges shipped with 60+ integration tests that had
  # only ever run on a contributor's laptop, and the class of bug they cover —
  # a query that returns the right answer for the wrong reason, a permission
  # boundary that stops enforcing — is invisible to lint, types and unit tests.
  #
  # It does not depend on code-quality, so it starts at once and the pull request
  # costs max(quality, integration) rather than their sum. A lint failure wasting
  # this job's minutes is the cheaper mistake.
  integration-tests:
    name: Integration Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404

    # The `test` database is only a control connection. The npm script creates
    # and drops a unique database for the run on this Postgres service.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate i18n translations
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Configure test environment
        run: |
          echo 'DATABASE_URL="postgres://root:mysecretpassword@localhost:5432/local"' > .env
          echo 'TEST_DATABASE_URL="postgres://root:mysecretpassword@localhost:5433/test"' >> .env
          echo 'BETTER_AUTH_SECRET="test-secret-for-github-actions"' >> .env
          echo 'BETTER_AUTH_URL="http://localhost:5173"' >> .env
          echo 'ENABLE_TEST_ENDPOINTS="true"' >> .env

      - name: Run integration tests
        run: npm run test:integration

  # E2E tests - requires built app and database.
  # Runs for pull requests as well as main so user-facing regressions block merges.
  e2e-tests:
    name: E2E Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [build, unit-tests, integration-tests]

    # E2E gets another disposable per-run database on this service; it never
    # reuses the integration job's fixtures or schema state.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Generate i18n translations
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Configure test environment
        run: |
          echo 'DATABASE_URL="postgres://root:mysecretpassword@localhost:5432/local"' > .env
          echo 'TEST_DATABASE_URL="postgres://root:mysecretpassword@localhost:5433/test"' >> .env
          echo 'BETTER_AUTH_SECRET="test-secret-for-github-actions"' >> .env
          echo 'BETTER_AUTH_URL="http://localhost:5173"' >> .env
          echo 'ENABLE_TEST_ENDPOINTS="true"' >> .env

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/package-lock.json') }}

      - name: Install Cypress binary
        run: npx cypress install

      - name: Verify Cypress
        run: npx cypress verify

      # The build artifact was downloaded above, so the E2E script does not
      # need to rebuild the app.
      #
      # Chat is on in production (`wrangler.jsonc`). The flag is read at
      # request time (`process.env` then the Worker binding in
      # `src/lib/server/feature-flags.ts`), not baked into that artifact —
      # so it is set here, not on `build`. `run-e2e.sh` copies it to
      # CYPRESS_FEATURE_INAPP_CHAT; without that the four chat specs
      # `this.skip()` and a deleted `$effect` on the scorecard stays green.
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          SKIP_BUILD: 'true'
          FEATURE_INAPP_CHAT: 'true'

      - name: Run email-verification E2E
        run: npm run test:e2e:verification
        env:
          SKIP_BUILD: 'true'
          FEATURE_INAPP_CHAT: 'true'

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7
          if-no-files-found: ignore
