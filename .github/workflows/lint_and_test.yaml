name: CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      # Documentation
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      # Development environment
      - '.devcontainer/**'
      - '.vscode/**'
      - '.idea/**'
      - '.claude/**'
      - '.dagger/**'
      - '.roo/**'
      # Git files
      - '.gitignore'
      - '.gitattributes'
      # Translation cache
      - 'project.inlang/cache/**'
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      # Documentation
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      # Development environment
      - '.devcontainer/**'
      - '.vscode/**'
      - '.idea/**'
      - '.claude/**'
      - '.dagger/**'
      - '.roo/**'
      # Git files
      - '.gitignore'
      - '.gitattributes'
      # Translation cache
      - 'project.inlang/cache/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Quick checks: Format, Type check, and Unit tests
  quick-checks:
    name: Format, Type Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Generate i18n files
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Format Check
        run: npm run format:check

      - name: Type Check
        run: npm run check

      - name: Unit Tests
        run: npm run test:unit

  # Build job - runs in parallel with quick-checks
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Generate i18n files
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Build application
        run: npm run build

      # Upload build artifacts for e2e tests
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .svelte-kit
            build
          retention-days: 1

  # E2E tests - uses build artifacts
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [quick-checks, build]

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Download build artifacts from build job
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Setup environment variables
        run: |
          echo 'DATABASE_URL="postgres://root:mysecretpassword@localhost:5432/local"' > .env
          echo 'TEST_DATABASE_URL="postgres://root:mysecretpassword@localhost:5433/test"' >> .env
          echo 'BETTER_AUTH_SECRET="test-secret-for-github-actions"' >> .env
          echo 'BETTER_AUTH_URL="http://localhost:5173"' >> .env

      # Cache Playwright binaries separately
      - name: Cache Playwright binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      # Install only system dependencies if browsers were cached
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
