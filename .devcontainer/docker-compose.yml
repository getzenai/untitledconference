version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    # Keep container running for development
    command: sleep infinity
    networks:
      - devcontainer-network
    depends_on:
      project-db:
        condition: service_healthy
      test-db:
        condition: service_healthy

  project-db:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    ports:
      - 5432:5432
    networks:
      - devcontainer-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d local']
      interval: 5s
      timeout: 5s
      retries: 5

  test-db:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-test-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: test
    ports:
      - 5433:5432
    networks:
      - devcontainer-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  postgres-test-data:

networks:
  devcontainer-network:
    driver: bridge
